name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: 単体テスト・静的検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    name: ブラウザ結合テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 素材はその場で ffmpeg で作る（実素材は要らない）
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 版の表示は git 管理外。無いと 404 になるので、公開時と同じように作る
      - run: node scripts/gen-version.mjs
      # ランナーに入っている Google Chrome を使う。
      # Chromium 版は H.264 / AAC を持たないので書き出しが試せない
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
