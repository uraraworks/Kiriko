name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 版の表示に commit 時刻を使うので、浅いクローンでも直近 1 件は要る
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ビルドは無い（素の静的ファイル）。版の表示だけ作る
      - run: node scripts/gen-version.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
