<!doctype html><meta charset="utf-8"><title>pipeline test</title>
<script src="vendor/mp4box.all.min.js"></script>
<body style="background:#111;color:#ddd;font:13px monospace"><pre id="o"></pre>
<script type="module">
import { Mp4Source } from './js/mp4source.js';
import { exportProject } from './js/exporter.js';
import * as P from './js/project.js';
const o = document.getElementById('o');
const log = (m) => { o.textContent += m + '\n'; console.log(m); };
window.__done = null;
window.runTest = async () => {
  try {
    const res = await fetch('testdata/sample90.mp4');
    const blob = await res.blob();
    const file = new File([blob], 'sample90.mp4', { type: 'video/mp4' });
    const t0 = performance.now();
    const src = new Mp4Source(file);
    await src.load((m) => log(m));
    log(`load ${(performance.now()-t0).toFixed(0)}ms  dur=${src.duration.toFixed(2)}s`);
    log(`video ${src.video.codec} ${src.video.width}x${src.video.height} samples=${src.video.samples.length} desc=${src.video.description?.byteLength}`);
    log(`audio ${src.audio.codec} ${src.audio.sampleRate}Hz ${src.audio.channels}ch samples=${src.audio.samples.length} desc=${src.audio.description?.byteLength}`);
    log(`first syncs: ${src.video.samples.slice(0,5).map(s=>`${s.time.toFixed(3)}${s.sync?'K':''}`).join(' ')}`);

    const proj = P.createProject();
    const id = 'src0';
    proj.sources.push({ id, name: src.name, duration: src.duration });
    proj.clips.push({ id: 'c1', sourceId: id, in: 10.0, out: 14.0, volume: 1 });
    proj.clips.push({ id: 'c2', sourceId: id, in: 40.0, out: 43.0, volume: 1 });
    const map = new Map([[id, src]]);
    const t1 = performance.now();
    const buf = await exportProject(proj, map, {
      onProgress: (r, t) => { o.dataset.p = `${(r*100).toFixed(0)}% ${t}`; },
      onLog: log,
    });
    log(`export ${(performance.now()-t1).toFixed(0)}ms  bytes=${buf.byteLength}`);
    window.__out = buf;
    window.__done = { ok: true, bytes: buf.byteLength, ms: performance.now()-t1 };
  } catch (e) {
    log('ERROR: ' + (e.stack || e.message));
    window.__done = { ok: false, error: String(e.message || e) };
  }
};
runTest();
</script>
